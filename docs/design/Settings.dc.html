<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cellwise — settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
a{color:#2B4C8C;text-decoration:none}a:hover{color:#1F3A6E}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 24px 24px; display: flex; flex-direction: column; background-color: #F5F1E8; background-image: radial-gradient(rgba(70, 55, 30, 0.05) 1px, transparent 1px); background-size: 5px 5px; font-family: Inter, system-ui, sans-serif; color: #1F1D1A">
  <header style="display: flex; align-items: center; gap: 6px; height: 48px; margin-left: -12px">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1F1D1A">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 5l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: Literata, Georgia, serif; font-size: 28px; font-weight: 600">Settings</h1>
  </header>

  <h2 style="margin: 16px 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5E5850">Game</h2>
  <div style="display: flex; flex-direction: column">
    <button type="button" aria-pressed="true" style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #CBBFA8; font-size: 15px; text-align: left">
      <span>Mistake limit (3)</span>
      <span aria-hidden="true" style="flex: none; width: 44px; height: 26px; box-sizing: border-box; padding: 3px; border-radius: 13px; background: #2B4C8C; display: flex; justify-content: flex-end"><span style="width: 20px; height: 20px; border-radius: 10px; background: #FBF8F1"></span></span>
    </button>
    <button type="button" aria-pressed="true" style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #CBBFA8; font-size: 15px; text-align: left">
      <span>Highlight row, column and box</span>
      <span aria-hidden="true" style="flex: none; width: 44px; height: 26px; box-sizing: border-box; padding: 3px; border-radius: 13px; background: #2B4C8C; display: flex; justify-content: flex-end"><span style="width: 20px; height: 20px; border-radius: 10px; background: #FBF8F1"></span></span>
    </button>
    <button type="button" aria-pressed="true" style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #CBBFA8; font-size: 15px; text-align: left">
      <span>Highlight matching digits</span>
      <span aria-hidden="true" style="flex: none; width: 44px; height: 26px; box-sizing: border-box; padding: 3px; border-radius: 13px; background: #2B4C8C; display: flex; justify-content: flex-end"><span style="width: 20px; height: 20px; border-radius: 10px; background: #FBF8F1"></span></span>
    </button>
    <button type="button" aria-pressed="false" style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #CBBFA8; font-size: 15px; text-align: left">
      <span>Sounds</span>
      <span aria-hidden="true" style="flex: none; width: 44px; height: 26px; box-sizing: border-box; padding: 3px; border: 1.5px solid #1F1D1A; border-radius: 13px; display: flex; justify-content: flex-start"><span style="width: 17px; height: 17px; border-radius: 9px; background: #1F1D1A"></span></span>
    </button>
    <button type="button" aria-pressed="true" style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #CBBFA8; font-size: 15px; text-align: left">
      <span>Haptics</span>
      <span aria-hidden="true" style="flex: none; width: 44px; height: 26px; box-sizing: border-box; padding: 3px; border-radius: 13px; background: #2B4C8C; display: flex; justify-content: flex-end"><span style="width: 20px; height: 20px; border-radius: 10px; background: #FBF8F1"></span></span>
    </button>
  </div>

  <h2 style="margin: 16px 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5E5850">Appearance</h2>
  <div style="padding: 10px 0; border-bottom: 1px solid #CBBFA8; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 15px">Theme</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1.5px solid #1F1D1A; border-radius: 4px; overflow: hidden">
      <button type="button" aria-pressed="true" style="height: 44px; background: #1F1D1A; color: #FBF8F1; font-size: 14px; font-weight: 600; text-align: center">Light</button>
      <button type="button" aria-pressed="false" style="height: 44px; border-left: 1.5px solid #1F1D1A; font-size: 14px; text-align: center">Dark</button>
      <button type="button" aria-pressed="false" style="height: 44px; border-left: 1.5px solid #1F1D1A; font-size: 14px; text-align: center">System</button>
    </div>
  </div>

  <h2 style="margin: 16px 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5E5850">Purchases</h2>
  <div style="display: flex; flex-direction: column">
    <button type="button" style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #CBBFA8; font-size: 15px; text-align: left">
      <span>Remove ads</span>
      <span style="flex: none; padding: 5px 12px; border: 1.5px solid #2B4C8C; border-radius: 4px; color: #2B4C8C; font-size: 14px; font-weight: 600">[PRICE]</span>
    </button>
    <button type="button" style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #CBBFA8; font-size: 15px; text-align: left">
      <span>Restore purchases</span>
    </button>
  </div>

  <h2 style="margin: 16px 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5E5850">Privacy</h2>
  <div style="display: flex; flex-direction: column">
    <button type="button" style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #CBBFA8; font-size: 15px; text-align: left">
      <span>Ad privacy choices</span>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#5E5850" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l5 5-5 5"></path></svg>
    </button>
    <button type="button" style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #CBBFA8; font-size: 15px; text-align: left">
      <span>Privacy policy</span>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#5E5850" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3h5v5M15 3l-7 7M13 11v4H3V5h4"></path></svg>
    </button>
  </div>
</main>
</x-dc>
